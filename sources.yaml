# 환율 (KRW 환산용). 필요하면 수정하세요.
rates:
  KRW: 1
  USD: 1400
  EUR: 1500
  JPY: 9.5

# 수집 설정
settings:
  interval_seconds: 300      # 전체 수집 주기
  per_site_delay: 0.2        # 같은 사이트 연속 요청 간 최소 간격(초) - 서버에 부담 주지 않기
  concurrency: 8
  queries: []                # 비워두면 알림 규칙(watch)의 키워드를 사용

sources:
  # --- 데모 (실제 사이트 아님) ---
  - {name: demo-a, type: demo, base_price: 9000}
  - {name: demo-b, type: demo, base_price: 11000}
  - {name: demo-c, type: demo, base_price: 8000}

  # --- 실제 사이트 추가 예시 (HTML) ---

  #   type: feed
  #   url: "${G2A_FEED_URL}"
  #   ttl: 3600                # 피드 다운로드 최소 간격(초)
  #   currency: EUR
  #   columns: {id: aw_product_id, title: product_name, link: aw_deep_link, price: search_price, currency: currency, category: category_name, stock: in_stock}

  # --- 실제 사이트 추가 예시 (HTML) ---
  # 사이트의 robots.txt / 이용약관을 확인하고, 공식 API·제휴 피드가 있으면 그쪽을 우선 사용하세요.
